
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>뉴스 홈페이지</title>

  <style>
    /* 페이지 기본 설정 */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: white;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* 1. 헤더 상단 */
    .top-header {
      max-width: 1200px;
      min-height: 135px;
      margin: 0 auto;
      padding: 28px 0 18px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: start;
    }

    /* 왼쪽 광고 */
    .ad {
      width: 234px;
      height: 60px;
      background-color: #2859a5;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    /* 가운데 로고와 검색창 */
    .brand-area {
      text-align: center;
    }

    .logo {
      font-family: Georgia, serif;
      font-size: 34px;
      font-weight: bold;
      color: #111;
      white-space: nowrap;
    }

    .logo-mark {
      color: #399bd6;
      font-size: 34px;
      margin-right: 8px;
    }

    .search-box {
      width: 300px;
      height: 38px;
      margin: 14px auto 0;
      border: 2px solid #222;
      border-radius: 25px;
      display: flex;
      align-items: center;
      padding: 0 10px;
    }

    .search-box input {
      width: 100%;
      border: none;
      outline: none;
      font-size: 15px;
    }

    .search-button {
      border: none;
      background: none;
      font-size: 23px;
      cursor: pointer;
    }

    /* 오른쪽 로그인 및 메뉴 */
    .top-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 16px;
      font-size: 13px;
      padding-top: 20px;
    }

    .login {
      color: #3156a5;
      text-decoration: underline;
      font-weight: bold;
    }

    .print {
      border: 1px solid #7ab4ff;
      border-radius: 20px;
      padding: 5px 12px;
      color: #3156a5;
      white-space: nowrap;
    }

    .menu {
      font-size: 27px;
      color: #111;
    }

    /* 2. 헤더 하단 메뉴 */
    .bottom-header {
      border-top: 1px solid #ddd;
      border-bottom: 2px solid #222;
    }

    .nav-inner {
      max-width: 1200px;
      min-height: 40px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    /* 왼쪽 뉴스 카테고리 */
    .categories {
      display: flex;
      align-items: center;
      gap: 17px;
    }

    .categories a {
      background-color: #4967bd;
      color: white;
      font-family: Georgia, serif;
      font-size: 14px;
      font-weight: bold;
      padding: 0 3px;
      white-space: nowrap;
    }

    /* 오른쪽 메뉴 버튼 */
    .extra-menu {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .extra-menu a {
      background-color: #468fe5;
      color: white;
      border-radius: 20px;
      padding: 4px 15px;
      font-family: Georgia, serif;
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
    }

    .extra-menu a:nth-child(2) {
      background-color: #3c70b2;
    }

    .extra-menu a:nth-child(3) {
      background-color: #99b9a8;
    }

    /* 작은 화면 대응 */
    @media (max-width: 900px) {
      .top-header,
      .nav-inner {
        padding-left: 16px;
        padding-right: 16px;
      }

      .ad {
        width: 170px;
        font-size: 11px;
      }

      .logo {
        font-size: 25px;
      }

      .logo-mark {
        font-size: 25px;
      }

      .top-actions {
        gap: 8px;
      }

      .categories {
        gap: 8px;
      }

      .extra-menu {
        gap: 5px;
      }

      .extra-menu a {
        padding: 4px 8px;
      }
    }
  </style>
</head>

<body>

  <!-- 상단 헤더 -->
  <header class="top-header">

    <!-- 왼쪽 광고 -->
    <div class="ad">
      KOREA INTERNATIONAL SCHOOL
    </div>

    <!-- 가운데 로고와 검색창 -->
    <div class="brand-area">
      <div class="logo">
        <span class="logo-mark">H</span>The Korea Herald
      </div>

      <form class="search-box" action="#" method="get">
        <input type="search" aria-label="검색">
        <button class="search-button" type="submit"
                aria-label="검색하기">⌕</button>
      </form>
    </div>

    <!-- 오른쪽 메뉴 -->
    <div class="top-actions">
      <a class="login" href="#">Log in</a>
      <a class="print" href="#">Print edition</a>
      <a class="menu" href="#" aria-label="메뉴">☰</a>
    </div>

  </header>

  <!-- 하단 내비게이션 -->
  <nav class="bottom-header">
    <div class="nav-inner">

      <!-- 뉴스 카테고리 -->
      <div class="categories">
        <a href="#">National</a>
        <a href="#">Business</a>
        <a href="#">Life&amp;Culture</a>
        <a href="#">Sports</a>
        <a href="#">World</a>
        <a href="#">Opinion</a>
        <a href="#">K-pop</a>
      </div>

      <!-- 추가 메뉴 -->
      <div class="extra-menu">
        <a href="#">For our subscribers</a>
        <a href="#">Newsletter</a>
        <a href="#">English Cafe</a>
      </div>

    </div>
  </nav>

</body>
</html>
