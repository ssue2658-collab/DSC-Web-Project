    <!--①. 새 창 링크 + 보안 속성 rel~~-->

    <h2>① 새 창/ 현재 창 링크</h2>
    <p>
        <a href="https://www.google.com" target="_blank" rel="nooperner noreferrer">구글(새 창)</a>
        <a href="https://www.google.com" target="_self" rel="nooperner noreferrer" >구글(현재 창)</a>
    </p>
    <!--②. 메일 보내기 : 제목(subject)과 본문(body)까지 미리 채우기-->
    <!--띄어쓰기는 %20, 여러 값은 &로 연결-->
    <h2>② 메일 보내기 : 제목(subject)과 본문(body)까지 미리 채우기</h2>
    <p>
        <a href="mailto:ssue2658@gmail.com?subject=수강%20문의&body=안녕하세요.%0a 장수 사과 구매 문의 드립니다." target="_blank" rel="nooperner noreferrer" title="장수 사과 담당자 메일 발송">🍎사과 구매 문의드립니다.🍎</a>
    </p>

    <p>

    </p>

    <h2>④ 내 사이트의 다른 페이지로 이동</h2>
    <p style="color: rgb(34, 187, 60); font-weight:bolder; font-size: 50px;>
